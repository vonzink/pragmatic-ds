# AWS Amplify Hosting build spec (monorepo).
# Amplify console: tick "My app is a monorepo" and enter `website` as the root.
# That sets AMPLIFY_MONOREPO_APP_ROOT=website automatically.
version: 1
applications:
  - appRoot: website
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        # Amplify's Next.js 14+ support expects `.next` here, even for a static
        # export (next.config.ts: output "export"). It serves the exported pages from it.
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
